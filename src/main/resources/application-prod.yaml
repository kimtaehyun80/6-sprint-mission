spring:
  config:
    activate:
      on-profile: prod


  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${PROD_DB_URL}
    username: ${PROD_DB_USERNAME}
    password: ${PROD_DB_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    open-in-view: false


server:
  port: 8081


logging:
  level:
    com.discodeit: info
    org.hibernate.SQL: warn
    org.hibernate.orm.jdbc.bind: warn


discodeit:
  storage:
    type: s3
    s3:
      bucket-name: discodeit-prod-bucket
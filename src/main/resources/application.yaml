spring:
  profiles:
    active: dev
  application:
    name: discodeit
  servlet:
    multipart:
      maxFileSize: 10MB # 파일 하나의 최대 크기
      maxRequestSize: 30MB  # 한 번에 최대 업로드 가능 용량


logging:
  level:
    root: info


discodeit:
  storage:
    type: filesystem
    path: /app/storage/files


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers


info:
  app:
    name: Discodeit
    version: 1.7.0
  java:
    version: 17
  spring-boot:
    version: 3.4.0